name: Preprocessing Automation

# Trigger: setiap push ke branch main, saat data mentah berubah, atau manual
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run preprocessing script
        run: |
          python "preprocessing/automate_Andi-Arif-Abdillah.py" \
            --input "telco_churn_raw/telco_churn_raw.csv" \
            --output "preprocessing/telco_churn_preprocessing.csv"

      - name: Upload processed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: telco-churn-preprocessing
          path: preprocessing/telco_churn_preprocessing.csv

      - name: Commit updated dataset
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_churn_preprocessing.csv
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada dataset hasil preprocessing."
          else
            git commit -m "chore: update processed dataset via CI [skip ci]"
            git push
          fi
